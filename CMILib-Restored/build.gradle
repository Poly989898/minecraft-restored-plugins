plugins { id 'java' }

java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    maven { url 'https://libraries.minecraft.net/' }
    maven { url 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.3.build.257-stable'
    compileOnly 'org.jetbrains:annotations:24.1.0'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    compileOnly 'com.mojang:authlib:10.0.77'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    // CMI API (published artifact, as in the original pom): the four CMI-touching sources compile against it
    compileOnly 'com.github.Zrips:CMI-API:9.7.14.3'
}

// Files listed in excludes.txt are not compiled yet; the original classes for them stay in the jar.
def excluded = file('excludes.txt').exists()
        ? file('excludes.txt').readLines('UTF-8').collect { it.trim() }.findAll { it && !it.startsWith('#') } as Set
        : [] as Set

sourceSets {
    main {
        java {
            exclude { el -> excluded.contains(el.path.replace('\\', '/')) }
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '100000', '-nowarn']
}

// Hybrid jar: rebuilt classes first, everything else from the original jar
tasks.named('jar') {
    archiveFileName = 'CMILib-1.6.1.3-restored.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
}
