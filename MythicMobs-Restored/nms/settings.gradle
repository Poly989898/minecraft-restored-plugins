pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url 'https://repo.papermc.io/repository/maven-public/' }
    }
}
rootProject.name = 'MythicMobs-nms'
// Only the paperweight (Paper devBundle) modules are included. The Spigot-mapped modules (w1_*, v1_*) need
// org.spigotmc:spigot snapshots that are not on public Maven repositories; their sources stay in nms/ but are not built.
include 'v26_1', 'v26_2', 'v26_3'
