plugins {
    id 'java'
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.24'
}

java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }

repositories {
    mavenCentral()
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    maven { url 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url 'https://libraries.minecraft.net/' }
}

dependencies {
    paperweight.paperDevBundle('26.3.build.257-stable')
    compileOnly 'org.jetbrains:annotations:24.1.0'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    compileOnly files('../../build/classes/java/main')
    compileOnly files('../../../CMILib-Restored/build/libs/CMILib-1.6.1.3-restored.jar')
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '100000', '-nowarn', '-proc:none']
}