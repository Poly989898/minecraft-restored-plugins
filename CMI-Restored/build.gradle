plugins { id 'java' }

java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url 'https://repo.lucko.me/' }
    maven { url 'https://repo.citizensnpcs.co/' }
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    maven { url 'https://libraries.minecraft.net/' }
    maven { url 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.3.build.257-stable'
    compileOnly 'org.jetbrains:annotations:24.1.0'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
    compileOnly 'com.mojang:authlib:10.0.77'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    compileOnly('com.github.MilkBowl:VaultAPI:1.7') { transitive = false }
    compileOnly('net.luckperms:api:5.4') { transitive = false }
    compileOnly('net.citizensnpcs:citizens-main:2.0.33-SNAPSHOT') { transitive = false }
    // CMILib is built from CMILib-Restored (run its build first)
    compileOnly files('../CMILib-Restored/build/libs/CMILib-1.6.1.3-restored.jar')
}

// Files listed in excludes.txt do not compile from sources yet and are left out of the build.
def excluded = file('excludes.txt').exists()
        ? file('excludes.txt').readLines('UTF-8').collect { it.trim() }.findAll { it && !it.startsWith('#') } as Set
        : [] as Set

// Compile-only stubs for optional plugin APIs (generated by tools/GenStubs.java). Not packaged into the jar.
sourceSets {
    main {
        java {
            exclude { el -> excluded.contains(el.path.replace('\\', '/')) }
        }
    }
    stubs {
        java.srcDir 'stubs/java'
        compileClasspath += sourceSets.main.compileClasspath
    }
}

// main sees the stubs; the stubs themselves only see the main dependencies (no cycle)
sourceSets.main.compileClasspath += sourceSets.stubs.output

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '100000', '-nowarn', '-XDshould-stop.ifError=FLOW']
}

// Jar: classes built from src/main/java and the 26.3 adapter from nms/v26_3.
tasks.named('jar') {
    archiveFileName = 'CMI-9.8.7.5-restored.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    from('nms/v26_3/build/classes/java/main') { include 'com/Zrips/CMI/NBT/MojangMappings*.class' }
}



tasks.register('printCp') {
    doLast { println 'CP:' + sourceSets.main.compileClasspath.asPath }
}

